<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github profile</title>
    <link rel="stylesheet" href="Assets/Styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="search-container">
        <div>
          <input type="text" placeholder="Search Github username" />
        </div>
        <div class="btn">Search</div>
      </div>

      <div class="profile">
        <div class="profile-container">
          <div>
            <img
              src=" Assets/Images/github.jpeg"
              alt="profile"
              class="profile1"
            />
          </div>

          <div>
            <h1>The Octocat</h1>
            <br />
            <span class="Octocat">aoctocat</span>
          </div>

          <div class="date">Joined 25 Jan 2011</div>
          <br />
        </div>

        <div class="bio">this profile has no bio...</div>

        <div class="people">
          <div>
            <h5>Repos</h5>
            <br /><span>8</span>
          </div>
          <div>
            <h5>Followers</h5>
            <br /><span>3938</span>
          </div>
          <div>
            <h5>Following</h5>
            <br /><span>19</span>
          </div>
        </div>

        <div class="social">
          <div><h5>Yaounde</h5></div>
          <div class="link"><a href="https://github.blog">blog</a></div>
        </div>
      </div>
    </div>
  </body>
</html>
